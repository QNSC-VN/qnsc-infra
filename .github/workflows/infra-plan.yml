# =============================================================================
# Infrastructure · Plan — dry-run on every PR to main.
# (OpenTofu under the hood — named by capability, not tool.)
# Runs for every managed environment in live/ (see the matrix below — add a
# new entry here when a new live/<name> stack is added). A `tofu fmt` job gates
# formatting drift.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/infra-plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  fmt:
    name: tofu fmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-plan
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt -check
        run: tofu fmt -check -recursive -diff

  plan:
    name: Plan ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.workspace }}

    strategy:
      fail-fast: false
      matrix:
        workspace: [bootstrap, security-baseline]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-plan
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/${{ matrix.workspace }}
        run: tofu init -input=false

      - name: tofu validate
        working-directory: live/${{ matrix.workspace }}
        run: tofu validate

      - name: tofu plan
        id: plan
        working-directory: live/${{ matrix.workspace }}
        run: tofu plan -input=false -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/${{ matrix.workspace }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Infrastructure Plan — \`live/${{ matrix.workspace }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
