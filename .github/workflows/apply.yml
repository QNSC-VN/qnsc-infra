# =============================================================================
# OpenTofu Apply — applies bootstrap on push to main.
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf).
# This workflow handles subsequent changes to bootstrap resources.
# =============================================================================
name: OpenTofu Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  apply-bootstrap:
    name: Apply bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap   # requires manual approval — platform-level blast radius

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/bootstrap
        run: tofu apply -input=false -auto-approve
