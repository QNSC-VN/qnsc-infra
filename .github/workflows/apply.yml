# =============================================================================
# OpenTofu Apply — applies each live/ stack on push to main.
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf
# history — the state-backend/OIDC-provider chicken-and-egg). This workflow
# handles subsequent changes, and first-time apply of any later stack
# (security-baseline onward) since those don't have the same bootstrap problem.
# =============================================================================
name: OpenTofu Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  apply-bootstrap:
    name: Apply bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap   # requires manual approval — platform-level blast radius

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/bootstrap
        run: tofu apply -input=false -auto-approve
        env:
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

  apply-security-baseline:
    name: Apply security-baseline
    needs: apply-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: security-baseline   # own approval gate — account-wide audit controls

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/security-baseline
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/security-baseline
        run: tofu apply -input=false -auto-approve
