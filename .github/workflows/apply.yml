# =============================================================================
# OpenTofu Apply — applies each live/ stack on push to main.
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf
# history — the state-backend/OIDC-provider chicken-and-egg). This workflow
# handles subsequent changes, and first-time apply of any later stack
# (platform-dev onward) since those don't have the same bootstrap problem.
# =============================================================================
name: OpenTofu Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  apply-bootstrap:
    name: Apply bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap   # requires manual approval — platform-level blast radius

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/bootstrap
        run: tofu apply -input=false -auto-approve

  apply-platform-dev:
    name: Apply platform-dev
    needs: apply-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: platform-dev   # separate approval gate from bootstrap

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/platform-dev
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/platform-dev
        run: tofu apply -input=false -auto-approve
