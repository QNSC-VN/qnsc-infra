name: Cleanup stale branches

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: This PR has been inactive for 30 days and will be closed in 7 days unless updated.
          close-pr-message: Closed due to inactivity. Re-open if still needed.
          stale-pr-label: stale
          exempt-pr-labels: 'keep-open,release'
