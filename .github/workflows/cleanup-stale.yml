name: Cleanup stale branches

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629  # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: This PR has been inactive for 30 days and will be closed in 7 days unless updated.
          close-pr-message: Closed due to inactivity. Re-open if still needed.
          stale-pr-label: stale
          exempt-pr-labels: 'keep-open,release'
