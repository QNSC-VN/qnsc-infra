# =============================================================================
# Infrastructure · Apply — applies each live/ stack on push to main.
# (OpenTofu under the hood — named by capability, not tool.)
#
# NOTE: First-time bootstrap must be run manually (see live/bootstrap/main.tf
# history — the state-backend/OIDC-provider chicken-and-egg). This workflow
# handles subsequent changes, and first-time apply of any later stack
# (security-baseline onward) since those don't have the same bootstrap problem.
# =============================================================================
name: Infrastructure · Apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

# Serialize applies on the same ref so two quick merges can't race the tofu
# state lock. Never cancel a running apply mid-flight.
concurrency:
  group: infra-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  apply-bootstrap:
    name: Apply bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bootstrap   # requires manual approval — platform-level blast radius

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/bootstrap
        run: tofu apply -input=false -auto-approve
        env:
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

  apply-security-baseline:
    name: Apply security-baseline
    needs: apply-bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: security-baseline   # own approval gate — account-wide audit controls

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1
        with:
          role-arn:     arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-apply
          aws-region:   ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: live/security-baseline
        run: tofu init -input=false

      - name: tofu apply
        working-directory: live/security-baseline
        run: tofu apply -input=false -auto-approve
