# =============================================================================
# OpenTofu Plan — dry-run on every PR to main.
# Runs for every managed environment in live/ (see the matrix below — add a
# new entry here when a new live/<name> stack is added).
# =============================================================================
name: OpenTofu Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  plan:
    name: Plan ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.workspace }}

    strategy:
      fail-fast: false
      matrix:
        workspace: [bootstrap]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d0407291516679297d9126  # v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/qnsc-github-infra-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: live/${{ matrix.workspace }}
        run: tofu init -input=false

      - name: tofu validate
        working-directory: live/${{ matrix.workspace }}
        run: tofu validate

      - name: tofu plan
        id: plan
        working-directory: live/${{ matrix.workspace }}
        run: tofu plan -input=false -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('live/${{ matrix.workspace }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### OpenTofu Plan — \`live/${{ matrix.workspace }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
